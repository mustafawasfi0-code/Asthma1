name: asthma_care
description: Native Flutter conversion of AsthmaCare.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  url_launcher: ^6.3.2
  geolocator: ^13.0.0
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/medications/
    - assets/source/




  fonts:
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/segoeui.ttf
          weight: 400
        - asset: assets/fonts/segoeuib.ttf
          weight: 700

